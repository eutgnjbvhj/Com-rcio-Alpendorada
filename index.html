const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let U=null,A=null,admin=false,tab='lojas',edit=null,q='',fc='',fs='',fo=false,so='',msg='',dirty=false;
const cat=id=>D.cats.find(c=>c.id===id)||{name:'Outros',icon:'🏪'};
const plan=id=>D.plans.find(p=>p.id===id)||D.plans[0];
const sub=s=>{const c=D.cats.find(x=>x.id===s.cat);return c&&c.subs&&c.subs.find(x=>x.id===s.sub)||null};
const DN=['dom','seg','ter','qua','qui','sex','sab'];
const nrm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function parseHours(h){const t=nrm(h);if(!/\d/.test(t)&&!/(fechad|encerrad)/.test(t))return null;
const iv=[[],[],[],[],[],[],[]];let any=false;
t.split(/[;\n|]+/).forEach(seg=>{let days=[];
const r=seg.match(/\b(dom|seg|ter|qua|qui|sex|sab)[a-z]*\s*(?:-|–|—|a|ate)\s*(dom|seg|ter|qua|qui|sex|sab)/);
if(r){let i=DN.indexOf(r[1]);const j=DN.indexOf(r[2]);for(let k=0;k<8;k++){days.push(i);if(i===j)break;i=(i+1)%7}}
else{(seg.match(/\b(dom|seg|ter|qua|qui|sex|sab)/g)||[]).forEach(x=>days.push(DN.indexOf(x)))}
if(!days.length)days=[0,1,2,3,4,5,6];
const tm=[...seg.matchAll(/(\d{1,2})\s*[:h]\s*(\d{2})?/g)].map(x=>(+x[1])*60+(+(x[2]||0)));
if(tm.length>=2){any=true;for(let k=0;k+1<tm.length;k+=2){const a=tm[k],b=tm[k+1];days.forEach(d=>{if(b>a)iv[d].push([a,b]);else{iv[d].push([a,1440]);iv[(d+1)%7].push([0,b])}})}}
else if(/fechad|encerrad/.test(seg))any=true});
return any?iv:null}
function nowPT(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Lisbon',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return{d:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday')),m:(+g('hour')%24)*60+(+g('minute'))}}
function isOpen(s,n){const iv=parseHours(s.hours);if(!iv)return null;n=n||nowPT();return iv[n.d].some(([a,b])=>n.m>=a&&n.m<b)}
const badge=s=>{const o=isOpen(s);return o===null?'':`<span class="st ${o?'on':'off'}">${o?'● Aberto':'● Fechado'}</span>`};
function ld(o){let e=document.getElementById('ld');if(!e){e=document.createElement('script');e.type='application/ld+json';e.id='ld';document.head.appendChild(e)}e.textContent=JSON.stringify(o).replace(/</g,'\\u003c')}
const siteLD=()=>({'@context':'https://schema.org','@type':'WebSite',name:'Comércio Alpendorada',inLanguage:'pt-PT',description:'Descobre os cafés, restaurantes, lojas e serviços de Alpendorada. Tudo num único lugar.',sameAs:[D.s.instagram,D.s.facebook].filter(Boolean)});
const ST={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const favs=()=>ST.get('ca_fav',[]),isFav=id=>favs().includes(id),favIc=id=>isFav(id)?'♥':'♡';
function toggleFav(id){const f=favs(),i=f.indexOf(id);i<0?f.push(id):f.splice(i,1);ST.set('ca_fav',f);favSync();if(location.hash==='#lista')route()}
function favSync(){document.querySelectorAll('[data-f]').forEach(b=>{const o=isFav(b.dataset.f);b.innerHTML=b.classList.contains('btn')?(o?'♥ Guardada':'♡ Guardar'):(o?'♥':'♡')});const n=favs().length,a=document.getElementById('fn');if(a)a.textContent=n?' ('+n+')':''}
document.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){e.preventDefault();e.stopPropagation();toggleFav(b.dataset.f)}});
function rec(id){const r=ST.get('ca_rec',[]).filter(x=>x!==id);r.unshift(id);ST.set('ca_rec',r.slice(0,6))}
function recHTML(){const l=ST.get('ca_rec',[]).map(id=>pub().find(s=>s.id===id)).filter(Boolean);return l.length?`<h2>Vistas recentemente</h2><div class="grid">${l.map(card).join('')}</div>`:''}
const cnt=id=>pub().filter(s=>s.cat===id).length;
function lev(a,b){const m=a.length,n=b.length;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function fuzzy(h,q){const H=nrm(h),W=H.split(/[^a-z0-9]+/).filter(Boolean);return nrm(q).split(/\s+/).filter(Boolean).every(t=>{if(H.includes(t))return true;const k=t.length<4?0:t.length<8?1:2;return k>0&&W.some(w=>lev(w,t)<=k||lev(w.slice(0,t.length),t)<=k)})}
const mq=s=>fuzzy([s.name,s.desc,s.addr,cat(s.cat).name,sub(s)?sub(s).name:''].join(' '),q);
const sugList=()=>`<datalist id="sug">${[...new Set(pub().map(s=>s.name).concat(D.cats.map(c=>c.name)))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`;
function greet(){const m=nowPT().m;return m<300||m>=1200?'Boa noite, Alpendorada!':m<720?'Bom dia, Alpendorada!':'Boa tarde, Alpendorada!'}
function hoursHTML(s){const iv=parseHours(s.hours);if(!iv)return esc(s.hours)||'—';const f=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),n=nowPT().d,N=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];return '<span class="hrs">'+[1,2,3,4,5,6,0].map(d=>{const t=iv[d].slice().sort((a,b)=>a[0]-b[0]).map(([a,b])=>f(a)+'–'+f(b)).join(' · ')||'Fechado';return `<b class="${d===n?'hn':''}">${N[d]}</b><span class="${d===n?'hn':''}">${t}</span>`}).join('')+'</span>'}
